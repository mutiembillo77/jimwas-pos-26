<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Gradients for metallic gold elements -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D58C" />
      <stop offset="35%" stop-color="#D4A359" />
      <stop offset="70%" stop-color="#E8BF72" />
      <stop offset="100%" stop-color="#B88238" />
    </linearGradient>

    <linearGradient id="gold-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE6B2" />
      <stop offset="50%" stop-color="#E5B869" />
      <stop offset="100%" stop-color="#C58E3C" />
    </linearGradient>

    <!-- Gradients for teal/cyan appliances -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4D4" />
      <stop offset="100%" stop-color="#008A96" />
    </linearGradient>

    <linearGradient id="cyan-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26D2E0" />
      <stop offset="100%" stop-color="#00A8B5" />
    </linearGradient>

    <!-- Dark Disc Gradient -->
    <radialGradient id="disc-bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#241B15" />
      <stop offset="75%" stop-color="#18110D" />
      <stop offset="100%" stop-color="#110B08" />
    </radialGradient>

    <!-- Arcs for text rendering -->
    <!-- Top arc for "Jimwas Enterprises" -->
    <path id="top-text-arc" d="M 170,480 A 370,370 0 0,1 854,480" fill="none" />

    <!-- Bottom arc for "FOR ALL YOUR HOUSE NEEDS," -->
    <path id="bottom-text-arc" d="M 830,620 A 385,385 0 0,1 194,620" fill="none" />
  </defs>

  <!-- 1. Base Dark Circular Badge -->
  <circle cx="512" cy="512" r="500" fill="url(#disc-bg)" stroke="#2E211A" stroke-width="4" />

  <!-- 2. Decorative Outer Gold Crescent Arcs -->
  <!-- Top-Right outer sweep -->
  <path d="M 370,120 C 580,105 820,220 900,430 C 910,458 912,475 918,500 C 916,460 890,340 790,240 C 690,140 500,115 370,120 Z" fill="url(#gold-grad)" opacity="0.95" />
  <!-- Bottom-Left outer sweep -->
  <path d="M 120,440 C 112,560 170,740 320,850 C 440,940 650,945 780,875 C 640,930 450,915 330,830 C 210,740 140,580 120,440 Z" fill="url(#gold-grad)" opacity="0.95" />

  <!-- Inner delicate gold guide ring -->
  <circle cx="512" cy="512" r="415" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.6" stroke-dasharray="12 4" />

  <!-- 3. Arched Typography -->
  <!-- Top Text: "Jimwas Enterprises" -->
  <text font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="bold" font-style="italic" font-size="64" fill="#FFFFFF" letter-spacing="2">
    <textPath href="#top-text-arc" startOffset="50%" text-anchor="middle">
      Jimwas Enterprises
    </textPath>
  </text>

  <!-- Bottom Text: "FOR ALL YOUR HOUSE NEEDS," -->
  <text font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="7" opacity="0.96">
    <textPath href="#bottom-text-arc" startOffset="50%" text-anchor="middle">
      FOR ALL YOUR HOUSE NEEDS,
    </textPath>
  </text>

  <!-- 4. Central Graphic Composition -->
  <g id="central-artwork">
    <!-- A. TOP APPLIANCE (Monitor / Microwave TV) -->
    <g id="top-monitor" transform="translate(470, 225)">
      <!-- Main Monitor/Oven Body (Gold) -->
      <rect x="0" y="0" width="165" height="115" rx="14" fill="url(#gold-grad)" stroke="#9A6924" stroke-width="2.5" />
      <!-- Dark Screen Display -->
      <rect x="18" y="15" width="105" height="85" rx="6" fill="#1C140E" stroke="#B38032" stroke-width="1.5" />
      <!-- Side Button Controls -->
      <rect x="133" y="24" width="18" height="12" rx="3" fill="#1C140E" />
      <rect x="133" y="44" width="18" height="12" rx="3" fill="#1C140E" />
      <rect x="133" y="64" width="18" height="12" rx="3" fill="#1C140E" />
      <!-- Base Stand -->
      <path d="M 52,115 L 113,115 L 125,138 L 40,138 Z" fill="url(#gold-grad-light)" />
      <!-- Pedestal Footing -->
      <rect x="-15" y="138" width="195" height="22" rx="11" fill="url(#gold-grad)" />
    </g>

    <!-- B. LEFT FLOOR LAMP (Gold) -->
    <g id="floor-lamp" transform="translate(255, 395)">
      <!-- Trapezoid Lampshade -->
      <polygon points="45,0 125,0 165,128 5,128" fill="url(#gold-grad)" stroke="#9A6924" stroke-width="2" />
      <!-- Lamp Stand (Angled L-Bracket) -->
      <path d="M 85,128 L 85,300 L 220,300 L 220,318 L 65,318 L 65,128 Z" fill="url(#gold-grad-light)" />
    </g>

    <!-- C. FLANKING POTTED PLANTS -->
    <!-- Left Plant -->
    <g id="plant-left" transform="translate(165, 595)">
      <polygon points="12,65 58,65 50,130 20,130" fill="url(#gold-grad)" stroke="#9A6924" stroke-width="1.5" />
      <!-- Cyan Leaves -->
      <path d="M 35,65 C 10,40 15,10 35,0 C 55,10 60,40 35,65 Z" fill="url(#cyan-light)" />
      <path d="M 28,65 C -2,50 -2,25 15,15 C 25,25 32,50 28,65 Z" fill="url(#cyan-grad)" />
      <path d="M 42,65 C 72,50 72,25 55,15 C 45,25 38,50 42,65 Z" fill="url(#cyan-grad)" />
    </g>

    <!-- Right Plant -->
    <g id="plant-right" transform="translate(795, 365)">
      <polygon points="15,48 60,48 52,110 23,110" fill="url(#gold-grad)" stroke="#9A6924" stroke-width="1.5" />
      <!-- Cyan Leaves -->
      <path d="M 37,48 C 15,25 20,2 37,-6 C 54,2 59,25 37,48 Z" fill="url(#cyan-light)" />
      <path d="M 30,48 C 3,36 3,14 18,6 C 26,14 33,36 30,48 Z" fill="url(#cyan-grad)" />
      <path d="M 44,48 C 71,36 71,14 56,6 C 48,14 41,36 44,48 Z" fill="url(#cyan-grad)" />
    </g>

    <!-- D. CENTER REFRIGERATOR (Cyan & Gold) -->
    <g id="refrigerator" transform="translate(520, 390)">
      <!-- Gold Top Freezer Compartment -->
      <rect x="0" y="0" width="105" height="60" rx="10" fill="url(#gold-grad)" stroke="#9A6924" stroke-width="2" />
      <!-- Cyan Main Fridge Body -->
      <rect x="0" y="58" width="105" height="120" rx="8" fill="url(#cyan-grad)" stroke="#00727D" stroke-width="2" />
      <!-- Handle line -->
      <rect x="8" y="70" width="6" height="40" rx="3" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- E. BLENDER / JUICER (Cyan & White) -->
    <g id="blender" transform="translate(475, 405)">
      <!-- Cyan Jar Top -->
      <path d="M 12,0 L 38,0 L 32,45 L 18,45 Z" fill="url(#cyan-light)" stroke="#00727D" stroke-width="1.5" />
      <!-- Handle -->
      <path d="M 12,10 C 2,15 2,30 14,35" fill="none" stroke="url(#cyan-light)" stroke-width="3.5" />
      <!-- Base (White) -->
      <rect x="14" y="45" width="22" height="20" rx="3" fill="#FFFFFF" />
      <circle cx="25" cy="55" r="3.5" fill="url(#cyan-grad)" />
    </g>

    <!-- F. FRONT-LOAD WASHING MACHINE (Cyan, White & Dark Glass) -->
    <g id="washing-machine" transform="translate(470, 470)">
      <!-- Main Appliance Cube -->
      <rect x="0" y="0" width="85" height="88" rx="8" fill="url(#cyan-light)" stroke="#00727D" stroke-width="2" />
      <!-- Top Control Panel (White) -->
      <rect x="0" y="0" width="85" height="18" rx="6" fill="#FFFFFF" />
      <circle cx="16" cy="9" r="4" fill="url(#cyan-grad)" />
      <rect x="52" y="6" width="22" height="6" rx="2" fill="#D5E8EB" />
      <!-- Circular Glass Door -->
      <circle cx="42" cy="53" r="28" fill="#1C140E" stroke="#FFFFFF" stroke-width="5" />
      <circle cx="42" cy="53" r="18" fill="#0C0806" />
      <circle cx="36" cy="47" r="5" fill="#FFFFFF" opacity="0.3" />
    </g>

    <!-- G. DYNAMIC GOLD ORBITAL RING & PCB CIRCUIT TRACES -->
    <g id="orbital-circuit" transform="translate(435, 420)">
      <!-- Sweeping Orbital Ring around washer/fridge -->
      <path d="M 15,135 C 10,70 120,40 185,85 C 240,120 220,175 140,185 C 60,195 20,180 15,135 Z" fill="none" stroke="url(#gold-grad)" stroke-width="16" stroke-linecap="round" />
      <path d="M 15,135 C 10,70 120,40 185,85 C 240,120 220,175 140,185 C 60,195 20,180 15,135 Z" fill="none" stroke="#FCE6B2" stroke-width="5" stroke-linecap="round" opacity="0.7" />

      <!-- Horizontal Circuit Traces (Extending to the right) -->
      <!-- Trace 1 (Top) -->
      <path d="M 215,85 L 290,50 L 350,50" fill="none" stroke="url(#gold-grad)" stroke-width="5.5" stroke-linecap="round" />
      <circle cx="355" cy="50" r="7" fill="url(#gold-grad-light)" stroke="#8F6220" stroke-width="1.5" />

      <!-- Trace 2 (Upper-mid) -->
      <path d="M 225,110 L 285,85 L 365,85" fill="none" stroke="url(#gold-grad)" stroke-width="5.5" stroke-linecap="round" />
      <circle cx="370" cy="85" r="7" fill="url(#gold-grad-light)" stroke="#8F6220" stroke-width="1.5" />

      <!-- Trace 3 (Mid) -->
      <path d="M 220,135 L 295,120 L 375,120" fill="none" stroke="url(#gold-grad)" stroke-width="5.5" stroke-linecap="round" />
      <circle cx="380" cy="120" r="7" fill="url(#gold-grad-light)" stroke="#8F6220" stroke-width="1.5" />

      <!-- Trace 4 (Lower-mid) -->
      <path d="M 205,160 L 275,155 L 345,155" fill="none" stroke="url(#gold-grad)" stroke-width="5.5" stroke-linecap="round" />
      <circle cx="350" cy="155" r="7" fill="url(#gold-grad-light)" stroke="#8F6220" stroke-width="1.5" />

      <!-- Trace 5 (Bottom) -->
      <path d="M 180,180 L 255,185 L 305,185" fill="none" stroke="url(#gold-grad)" stroke-width="5.5" stroke-linecap="round" />
      <circle cx="310" cy="185" r="7" fill="url(#gold-grad-light)" stroke="#8F6220" stroke-width="1.5" />
    </g>
  </g>
</svg>
