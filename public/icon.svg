<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold Linear Gradient -->
    <linearGradient id="icon-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE6B2" />
      <stop offset="40%" stop-color="#D4A359" />
      <stop offset="100%" stop-color="#B88238" />
    </linearGradient>

    <!-- Cyan Linear Gradient -->
    <linearGradient id="icon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26D2E0" />
      <stop offset="100%" stop-color="#008A96" />
    </linearGradient>

    <!-- Background Radial Gradient -->
    <radialGradient id="icon-bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#241B15" />
      <stop offset="85%" stop-color="#140E0B" />
      <stop offset="100%" stop-color="#0E0907" />
    </radialGradient>
  </defs>

  <!-- 1. Background Circular Base -->
  <circle cx="256" cy="256" r="248" fill="url(#icon-bg)" stroke="#2E211A" stroke-width="4" />

  <!-- 2. Concentric Gold Outer Arc Accents -->
  <path d="M 180,45 C 310,35 440,110 475,230 C 480,245 470,230 430,140 C 370,80 260,50 180,45 Z" fill="url(#icon-gold)" />
  <path d="M 45,260 C 40,360 110,445 220,475 C 130,440 70,360 45,260 Z" fill="url(#icon-gold)" />

  <!-- 3. Central Brand Composition (Bold & Legible at 16x16 / 32x32) -->
  <g transform="translate(18, 0)">
    <!-- Top Microwave/Monitor Accent (Gold) -->
    <rect x="220" y="105" width="105" height="70" rx="10" fill="url(#icon-gold)" />
    <rect x="232" y="116" width="62" height="48" rx="4" fill="#140E0B" />
    <!-- Pedestal Base -->
    <rect x="205" y="180" width="135" height="14" rx="7" fill="url(#icon-gold)" />

    <!-- Left Floor Lamp Accent (Gold) -->
    <polygon points="120,185 170,185 195,255 95,255" fill="url(#icon-gold)" />
    <path d="M 145,255 L 145,360 L 225,360 L 225,374 L 132,374 L 132,255 Z" fill="url(#icon-gold)" />

    <!-- Center Refrigerator (Cyan & Gold) -->
    <rect x="260" y="200" width="75" height="40" rx="7" fill="url(#icon-gold)" />
    <rect x="260" y="242" width="75" height="85" rx="6" fill="url(#icon-cyan)" />

    <!-- Front-Load Washer (Cyan & White Glass) -->
    <rect x="215" y="255" width="65" height="68" rx="7" fill="url(#icon-cyan)" />
    <circle cx="248" cy="296" r="22" fill="#140E0B" stroke="#FFFFFF" stroke-width="4.5" />

    <!-- Sweeping Dynamic Orbital Ring (Gold) -->
    <path d="M 195,305 C 190,245 285,225 335,265 C 380,300 360,345 295,355 C 235,362 200,345 195,305 Z" fill="none" stroke="url(#icon-gold)" stroke-width="15" stroke-linecap="round" />

    <!-- Circuit Trace Accents -->
    <path d="M 355,265 L 415,235" fill="none" stroke="url(#icon-gold)" stroke-width="5" stroke-linecap="round" />
    <circle cx="420" cy="232" r="6" fill="url(#icon-gold)" />

    <path d="M 365,290 L 430,270" fill="none" stroke="url(#icon-gold)" stroke-width="5" stroke-linecap="round" />
    <circle cx="435" cy="268" r="6" fill="url(#icon-gold)" />

    <path d="M 360,315 L 435,305" fill="none" stroke="url(#icon-gold)" stroke-width="5" stroke-linecap="round" />
    <circle cx="440" cy="303" r="6" fill="url(#icon-gold)" />

    <path d="M 345,340 L 410,340" fill="none" stroke="url(#icon-gold)" stroke-width="5" stroke-linecap="round" />
    <circle cx="415" cy="340" r="6" fill="url(#icon-gold)" />
  </g>
</svg>