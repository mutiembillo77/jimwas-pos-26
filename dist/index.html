  <body>
    <div id="root"><div id="boot-fallback" style="min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif"><div style="text-align:center"><strong style="font-size:20px">Loading Jimwas POS…</strong><p style="color:#94a3b8">Starting the secure workspace</p></div></div></div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && root.querySelector('#boot-fallback')) root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif"><div style="max-width:520px;padding:24px;text-align:center"><strong style="font-size:20px">Jimwas POS could not start</strong><p style="color:#fca5a5">' + String(event.error?.message || event.message || 'Preview startup failed') + '</p><button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:8px;background:#059669;color:white">Reload preview</button></div></div>';
      });
      window.addEventListener('unhandledrejection', function (event) {
        var root = document.getElementById('root');
        if (root && root.querySelector('#boot-fallback')) root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif"><div style="max-width:520px;padding:24px;text-align:center"><strong style="font-size:20px">Jimwas POS could not start</strong><p style="color:#fca5a5">' + String(event.reason?.message || event.reason || 'Preview startup failed') + '</p><button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:8px;background:#059669;color:white">Reload preview</button></div></div>';
      });
      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.querySelector('#boot-fallback')) root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif"><div style="max-width:520px;padding:24px;text-align:center"><strong style="font-size:20px">Jimwas POS is taking too long to start</strong><p style="color:#fca5a5">The preview JavaScript did not finish loading.</p><button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:8px;background:#059669;color:white">Reload preview</button></div></div>';
      }, 8000);
    </script>
  </body>
